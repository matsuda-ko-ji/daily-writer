<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daily Writer</title>
</head>
<body>

    <h1>Daily Writer</h1>

    <p>日報・挨拶文の生成ツール</p>

    <form action="/generate" method="post">

        <label for="type">生成する文章</label>

        <select id="type" name="type">
            <option value="START"
                    th:selected="${selectedType.name() == 'START'}">
                開始の挨拶
            </option>

            <option value="END"
                    th:selected="${selectedType.name() == 'END'}">
                終了の挨拶
            </option>

            <option value="REPORT"
                    th:selected="${selectedType.name() == 'REPORT'}">
                日報の所感
            </option>
        </select>

        <div>
            <label for="tone">文章のトーン</label>

            <select id="tone" name="tone">

                <option value="NORMAL"
                        th:selected="${selectedTone.name() == 'NORMAL'}">
                    標準
                </option>

                <option value="POLITE"
                        th:selected="${selectedTone.name() == 'POLITE'}">
                    丁寧
                </option>

                <option value="CONCISE"
                        th:selected="${selectedTone.name() == 'CONCISE'}">
                    簡潔
                </option>

            </select>
        </div>

        <div>
            <label for="workContent">今日やったこと</label>
            <input
                    type="text"
                    id="workContent"
                    name="workContent"
                    th:value="${workContent}">
            
            <p th:if="${errorMessage != null}"
               th:text="${errorMessage}">
            </p>
        </div>

        <div>
            <label for="generationMethod">生成方法</label>

            <select
                id="generationMethod"
                name="generationMethod"
            >
                <option
                    value="template"
                    th:selected="${selectedGenerationMethod == 'template'}"
                >
                    定型文で生成
                </option>

                <option
                    value="ai"
                    th:selected="${selectedGenerationMethod == 'ai'}"
                >
                    AIで生成
                </option>
            </select>
        </div>

        <button type="submit">文章を生成する</button>

    </form>

    <div th:if="${message != null}">
        <h2>生成結果</h2>
        <p th:text="${message}"></p>
    </div>

    <hr>

    <section>
        <h2>今日のニュース</h2>

        <!-- ニュース取得失敗時 -->
        <p th:if="${newsError != null}"
        th:text="${newsError}">
            ニュース取得エラー
        </p>

        <!-- ニュースが0件の場合 -->
        <p th:if="${newsError == null and #lists.isEmpty(newsList)}">
            現在、ニュースはありません。
        </p>

        <!-- ニュースが取得できた場合 -->
        <ul th:if="${newsError == null and !#lists.isEmpty(newsList)}">

            <li th:each="news : ${newsList}">

                <!-- ニュースタイトル -->
                <h3 th:text="${news.title}">
                    ニュースタイトル
                </h3>

                <!-- カテゴリと取得元 -->
                <p>
                    <span th:text="${news.category.displayName}">
                        カテゴリ
                    </span>

                    <span> ｜ </span>

                    <span th:text="${news.sourceName}">
                        ニュース取得元
                    </span>
                </p>

                <!-- 元記事へのリンク -->
                <a th:href="${news.url}"
                target="_blank"
                rel="noopener noreferrer">
                    記事を読む
                </a>

            </li>

        </ul>
    </section>

</body>
</html>
