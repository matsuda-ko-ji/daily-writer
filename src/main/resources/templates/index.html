<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daily Writer</title>
</head>
<body>

    <h1>Daily Writer</h1>

    <p>日報・挨拶文の生成ツール</p>

    <form action="/generate" method="post">

        <label for="type">生成する文章</label>

        <select id="type" name="type">
            <option value="START"
                    th:selected="${selectedType.name() == 'START'}">
                開始の挨拶
            </option>

            <option value="END"
                    th:selected="${selectedType.name() == 'END'}">
                終了の挨拶
            </option>

            <option value="REPORT"
                    th:selected="${selectedType.name() == 'REPORT'}">
                日報の所感
            </option>
        </select>

        <div>
            <label for="tone">文章のトーン</label>

            <select id="tone" name="tone">

                <option value="NORMAL"
                        th:selected="${selectedTone == 'NORMAL'}">
                    標準
                </option>

                <option value="POLITE"
                        th:selected="${selectedTone == 'POLITE'}">
                    丁寧
                </option>

                <option value="CONCISE"
                        th:selected="${selectedTone == 'CONCISE'}">
                    簡潔
                </option>

            </select>
        </div>

        <div>
            <label for="workContent">今日やったこと</label>
            <input
                    type="text"
                    id="workContent"
                    name="workContent"
                    th:value="${workContent}">
            
            <p th:if="${errorMessage != null}"
               th:text="${errorMessage}">
            </p>
        </div>

        <button type="submit">文章を生成する</button>

    </form>

    <div th:if="${message != null}">
        <h2>生成結果</h2>
        <p th:text="${message}"></p>
    </div>

    <hr>

    <section>
        <h2>今日のITニュース</h2>

        <p th:if="${#lists.isEmpty(newsList)}">
            現在、ニュースはありません。
        </p>

        <ul th:unless="${#lists.isEmpty(newsList)}">

            <li th:each="news : ${newsList}">

                <h3 th:text="${news.title}">
                    ニュースタイトル
                </h3>

                <a th:href="${news.url}"
                target="_blank"
                rel="noopener noreferrer">
                    記事を読む
                </a>

            </li>

        </ul>
    </section>

</body>
</html>
